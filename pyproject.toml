[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-history-cleaner"
version = "1.1.1"
description = "Remove obsolete file history while preserving the current Git tree"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "CyberGarage"}]
dependencies = ["git-filter-repo>=2.47,<3", "tomli>=2; python_version < '3.11'"]
keywords = ["git", "history", "cleanup", "repository"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Repository = "https://github.com/cybergarage/git-history-cleaner"
Issues = "https://github.com/cybergarage/git-history-cleaner/issues"

[project.scripts]
git-history-cleaner = "git_history_cleaner.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=6"]

[tool.setuptools.packages.find]
where = ["src"]
